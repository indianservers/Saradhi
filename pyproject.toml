[project]
name = "quickbuddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5,<6",
  "arq>=0.26,<0.29", "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23,<26", "tzdata>=2025.1",
  "httpx>=0.28,<1", "prometheus-client>=0.26,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["backend*", "ai_platform*"]
[tool.setuptools.package-data]
backend = ["migrations/versions/*.json", "migrations/versions/*.sql", "migrations/*.mako"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/persistence/guards.py" = ["E501"]
"backend/migrations/versions/20261026_0003_refund_approval.py" = ["E501"]
