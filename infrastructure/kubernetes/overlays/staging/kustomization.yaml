apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quickbuddy-staging
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: quickbuddy-config
    patch: |-
      - op: add
        path: /data/APP_ENV
        value: staging
