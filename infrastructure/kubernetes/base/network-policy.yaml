apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quickbuddy-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quickbuddy-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quickbuddy-worker-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quickbuddy-worker
  policyTypes: ["Ingress"]
  ingress: []
