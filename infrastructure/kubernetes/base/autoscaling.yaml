apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quickbuddy-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quickbuddy-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
