name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quickbuddy_test
          POSTGRES_USER: quickbuddy_test_owner
          POSTGRES_PASSWORD: ci-only-disposable-test-password
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U quickbuddy_test_owner -d quickbuddy_test' --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://quickbuddy_test_owner:ci-only-disposable-test-password@127.0.0.1:5432/quickbuddy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check backend tools tests && ruff format --check backend tools tests
      - run: pytest
      - run: python tools/validation/structure.py
      - run: python tools/validation/source_safety.py
      - run: python -m backend.scripts.export_openapi && git diff --exit-code -- packages/api_contracts/openapi.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run contracts && git diff --exit-code -- packages/typescript_sdk/src/schema.d.ts
      - run: npm run typecheck && npm run format:check && npm run build
  redis-worker:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m backend.scripts.worker_smoke
